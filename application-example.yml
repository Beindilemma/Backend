# ============================================================
# 享迹AI 应用配置模板
#
# 使用方式：
#   1. 复制此文件为 src/main/resources/application.yml
#   2. 将下方所有 your_xxx_here 替换为你自己的真实密钥
#   3. 本地敏感配置可另存为 application-local.yml（已在 .gitignore 中排除）
# ============================================================

server:
  port: 8080
  servlet:
    context-path: /api
  tomcat:
    connection-timeout: 180s

spring:
  # 可选加载本地密钥（见 application-local.yml，已在 .gitignore）
  config:
    import: optional:classpath:application-local.yml

  # 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/ai_trip?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true
    username: your_mysql_username
    password: your_mysql_password
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  # Redis 配置（Spring Boot 3.x 写法）
  data:
    redis:
      host: your_redis_host
      port: 6379
      password: your_redis_password # 如无密码留空
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # Jackson 时间格式配置
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.aitrip.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# ============================================================
# 微信小程序配置
# 获取方式：微信公众平台 → 开发 → 开发管理 → 开发设置
# 地址：https://mp.weixin.qq.com/
# ============================================================
wechat:
  miniapp:
    app-id: your_wechat_miniapp_appid
    app-secret: your_wechat_miniapp_appsecret

# ============================================================
# 大模型（OpenAI 兼容接口，如 DeepSeek、OpenAI）
# 获取方式：
#   - DeepSeek：https://platform.deepseek.com/api_keys
#   - OpenAI：https://platform.openai.com/api-keys
# ============================================================
ai:
  llm:
    # 完整 Chat Completions URL
    # DeepSeek 示例：https://api.deepseek.com/v1/chat/completions
    # OpenAI 示例：https://api.openai.com/v1/chat/completions
    chat-url: https://api.deepseek.com/v1/chat/completions
    api-key: your_llm_api_key_here
    model: deepseek-chat
    max-retries: 3
    temperature: 0.2
    # 重试耗尽后：true 返回空列表；false 抛出业务异常
    return-empty-on-failure: true

# ============================================================
# 高德地图 Web 服务 Key
# 获取方式：高德开放平台 → 应用管理 → 我的应用
# 地址：https://console.amap.com/dev/key/app
# ============================================================
amap:
  key: your_amap_web_key_here
  # 两次 Web 请求之间的最小间隔（毫秒），减轻个人 Key 的 QPS 触发 10021
  request-interval-ms: 220
  # infocode=10021 时最多额外重试次数（不含首次）
  qps-retry-max: 4
  qps-retry-backoff-ms: 650

# 行程详情 Redis 缓存（嵌套 VO JSON，减轻重复查库）
itinerary:
  detail-cache-ttl-seconds: 600

# ============================================================
# JWT 配置
# secret 建议生成方式（Linux/macOS）：
#   openssl rand -base64 64
# 或在 Windows PowerShell 中：
#   [Convert]::ToBase64String((1..64 | ForEach-Object { Get-Random -Maximum 256 }))
# ============================================================
jwt:
  secret: your-jwt-secret-key-at-least-256-bits-long-for-security
  expire: 604800 # 7天，单位秒

# 日志配置
logging:
  level:
    com.aitrip: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
